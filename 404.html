<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0c0a">
  <title>404 — LinuxTerminal</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#0a0c0a;color:#00ff41;font-family:'JetBrains Mono','Courier New',monospace;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
    .box{max-width:600px}
    h1{font-size:80px;text-shadow:0 0 20px #00ff41;animation:blink 1.5s ease-in-out infinite}
    h2{font-size:18px;color:#00cc33;margin:16px 0;letter-spacing:2px}
    p{color:#3a5c3a;font-size:14px;margin:8px 0;line-height:1.6}
    a{color:#00ff41;text-decoration:none;border:1px solid #004d14;padding:10px 24px;border-radius:4px;display:inline-block;margin-top:24px;transition:all .2s}
    a:hover{background:#0a1f0e;border-color:#00ff41;box-shadow:0 0 12px #00cc33}
    pre{color:#3a5c3a;font-size:11px;margin-top:32px;text-align:left;display:inline-block}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>PAGE NOT FOUND</h2>
    <p>$ cat /requested/page</p>
    <p>cat: requested/page: Arquivo ou diretorio nao encontrado</p>
    <a href="/">&lt; voltar ao terminal</a>
    <pre>
  __ __    ___  _  _
 / // /   / _ \| || |
/ // / | | (_) | || |_
\__/  |_| \___/|_||___|
    </pre>
  </div>
</body>
</html>
